<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background circle with subtle border -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="12 6" opacity="0.6" />
  
  <!-- Stylized Person Avatar -->
  <g fill="#f8fafc">
    <!-- Head -->
    <circle cx="200" cy="150" r="58" fill="#e2e8f0" />
    <!-- Hair -->
    <path d="M142,148 C142,95 170,82 200,82 C230,82 258,95 258,148 C250,115 235,108 200,108 C165,108 150,115 142,148 Z" fill="#0f172a" />
    <!-- Glasses / Tech Developer touch -->
    <rect x="160" y="140" width="32" height="20" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
    <rect x="208" y="140" width="32" height="20" rx="4" fill="none" stroke="#0284c7" stroke-width="3" />
    <line x1="192" y1="148" x2="208" y2="148" stroke="#0284c7" stroke-width="3" />
    <!-- Neck -->
    <path d="M185,200 L215,200 L215,230 L185,230 Z" fill="#cbd5e1" />
    <!-- Shoulders & Torso -->
    <path d="M110,320 C110,250 150,230 200,230 C250,230 290,250 290,320 Z" fill="#1e293b" />
    <!-- Collar / Shirt Detail -->
    <polygon points="200,265 175,230 225,230" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Mechanical + Code badges badge icon -->
  <circle cx="295" cy="275" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <!-- Code bracket icon -->
  <text x="295" y="283" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
</svg>
